services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    networks:
      - app-network

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
